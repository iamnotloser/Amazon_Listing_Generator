# 使用共享的 Caddy 网关（部署在同机的 gateway 服务上），不自带 caddy。
# 启动前确保存在外部 Docker 网络： docker network create web
# 网关 Caddyfile 中加一个站点： reverse_proxy listinggen-web:8000

services:
  web:
    build: .
    image: listinggen:latest
    container_name: listinggen-web
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./listing_gen/data/cache:/app/listing_gen/data/cache
      - ./output:/app/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
    expose:
      - "8000"
    networks:
      - web

networks:
  web:
    external: true
