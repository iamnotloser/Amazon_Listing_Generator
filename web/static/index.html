<meta charset="utf-8">
<title>Amazon Listing 生成器</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root{
    color-scheme: light;
    --bg:#f6f7f9; --card:#fff; --text:#17181c; --muted:#6b7280; --line:#e5e7eb;
    --brand:#0b8a4b; --brand-soft:#e9f7ef; --warn:#b45309; --warn-soft:#fef3c7;
    --input:#fff; --btn-text:#fff; --log-bg:#f8fafc; --log-text:#334155;
    --ok:#047857; --bad:#b91c1c; --overlay:rgba(15,23,42,.55);
    --radius:12px;
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0d1117; --card:#161b22; --text:#e6edf3; --muted:#8b98a5; --line:#2a323c;
    --brand:#3fb950; --brand-soft:#132a1a; --warn:#d29922; --warn-soft:#2b2312;
    --input:#0d1117; --btn-text:#07130c; --log-bg:#0d1117; --log-text:#c9d1d9;
    --ok:#3fb950; --bad:#f85149; --overlay:rgba(0,0,0,.68);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.6 -apple-system,"PingFang SC","Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .card h2{font-size:15px;margin:0 0 14px}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tab{flex:1;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);
       cursor:pointer;font-size:13px;color:var(--muted);text-align:center}
  .tab.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;
       font:inherit;background:var(--input);color:var(--text)}
  textarea{min-height:76px;resize:vertical}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .hint{font-size:11px;color:var(--muted);margin-top:4px}
  details{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
  summary{cursor:pointer;font-size:13px;color:var(--muted)}
  .check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);margin-top:12px}
  .check input{width:auto}
  button.primary{width:100%;margin-top:18px;padding:11px;border:0;border-radius:10px;
       background:var(--brand);color:var(--btn-text);font-size:15px;font-weight:600;cursor:pointer}
  button.primary:disabled{opacity:.55;cursor:not-allowed}
  .log{background:var(--log-bg);color:var(--log-text);border:1px solid var(--line);border-radius:10px;padding:12px;height:300px;overflow:auto;
       font:12px/1.7 ui-monospace,Consolas,monospace;white-space:pre-wrap}
  .log .ok{color:var(--ok)}.log .bad{color:var(--bad)}
  .status{font-size:12px;color:var(--muted);margin-bottom:8px}
  .result-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .pill{font-size:11px;padding:2px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .block{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  .block h3{font-size:12px;color:var(--muted);font-weight:500;margin:0 0 8px;
       display:flex;justify-content:space-between;align-items:center}
  .en{font-size:14px;margin:0 0 6px}
  .zh{font-size:13px;color:var(--muted);margin:0}
  .copy{border:1px solid var(--line);background:var(--card);border-radius:7px;font-size:11px;
       padding:3px 8px;cursor:pointer;color:var(--muted)}
  .copy:hover{border-color:var(--brand);color:var(--brand)}
  .bullet{border-top:1px solid var(--line);padding:10px 0}
  .bullet:first-of-type{border-top:0;padding-top:0}
  .idx{display:inline-block;width:20px;color:var(--muted);font-size:12px}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:40px 0}
  .issues{margin:8px 0 0;padding-left:18px;font-size:12px;color:var(--warn)}
  .vars{font-size:13px}
  .vars li{margin-bottom:8px}
  .hide{display:none}
  .action{border:1px solid var(--brand);background:var(--brand-soft);color:var(--brand);border-radius:8px;font-size:13px;font-weight:600;padding:6px 14px;cursor:pointer;white-space:nowrap;position:relative}
  .action:hover{background:var(--brand);color:var(--btn-text)}
  .action.warn{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
  .action.warn:hover{background:var(--warn);color:#fff}
  .action.ghost{background:transparent}
  .action:disabled{opacity:.45;cursor:not-allowed}
  .result-head .btns{display:flex;gap:8px;margin-left:auto;align-items:center}
  @media(max-width:520px){.result-head{flex-wrap:wrap}.result-head .btns{margin-top:8px;margin-left:0;flex:1}}
  /* 下载按钮 + 下拉菜单 */
  .dl-wrap{position:relative;display:inline-block}
  .dl-menu{position:absolute;top:calc(100% + 6px);right:0;min-width:180px;background:var(--card);border:1px solid var(--line);
    border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px 0;z-index:55;display:none}
  .dl-menu.show{display:block}
  .dl-menu button{display:block;width:100%;padding:8px 14px;border:0;background:transparent;color:var(--text);
    font-size:13px;text-align:left;cursor:pointer}
  .dl-menu button:hover{background:var(--brand-soft);color:var(--brand)}
  .dl-wrap.ghost .action::after{content:" ▾";font-size:11px}
</style>
<script>
(function(){
  var KEY = "lg_theme";
  var root = document.documentElement;
  var mq = window.matchMedia("(prefers-color-scheme: dark)");

  function apply(theme){
    root.setAttribute("data-theme", theme);
    var btn = document.getElementById("themeBtn");
    var sun = document.getElementById("iconSun");
    var moon = document.getElementById("iconMoon");
    // 亮色显示月亮（点击切暗），暗色显示太阳（点击切亮）
    if (sun) sun.classList.toggle("off", theme !== "dark");
    if (moon) moon.classList.toggle("off", theme !== "light");
    if (btn) {
      var tip = theme === "dark" ? "切换到亮色模式" : "切换到暗色模式";
      btn.title = tip;
      btn.setAttribute("aria-label", tip);
    }
  }

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  apply(saved === "dark" || saved === "light" ? saved : (mq.matches ? "dark" : "light"));

  window.addEventListener("DOMContentLoaded", function(){
    apply(root.getAttribute("data-theme"));
    var btn = document.getElementById("themeBtn");
    if (!btn) return;
    btn.addEventListener("click", function(){
      var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      apply(next);
      try { localStorage.setItem(KEY, next); } catch (e) {}
    });
  });

  // 未手动选择过时，跟随系统变化
  if (mq.addEventListener) {
    mq.addEventListener("change", function(e){
      var chosen = null;
      try { chosen = localStorage.getItem(KEY); } catch (err) {}
      if (chosen !== "dark" && chosen !== "light") apply(e.matches ? "dark" : "light");
    });
  }
})();
</script>

<script>
(function(){
  const $ = id => document.getElementById(id);
  let mode = "manual";
  let jobId = null, timer = null, compData = [];
  let reviewData = {};
  let lastPayload = null;

  // —— 历史记录：IndexedDB，仅存在当前浏览器，不上传服务器 ——
  const HIST = {db:"listing_gen", ver:1, store:"history"};

  function histOpen(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(HIST.db, HIST.ver);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(HIST.store)) {
          const s = db.createObjectStore(HIST.store, {keyPath:"id"});
          s.createIndex("created_at", "created_at");
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function histAll(){
    const db = await histOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(HIST.store, "readonly");
      const req = tx.objectStore(HIST.store).getAll();
      req.onsuccess = () => {
        db.close();
        resolve((req.result || []).sort((a, b) => b.created_at - a.created_at));
      };
      req.onerror = () => { db.close(); reject(req.error); };
    });
  }

  async function histPut(rec){
    const db = await histOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(HIST.store, "readwrite");
      tx.objectStore(HIST.store).put(rec);
      tx.oncomplete = () => { db.close(); resolve(); };
      tx.onerror = () => { db.close(); reject(tx.error); };
    });
  }

  async function histDelete(id){
    const db = await histOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(HIST.store, "readwrite");
      tx.objectStore(HIST.store).delete(id);
      tx.oncomplete = () => { db.close(); resolve(); };
      tx.onerror = () => { db.close(); reject(tx.error); };
    });
  }

  async function histClear(){
    const db = await histOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(HIST.store, "readwrite");
      tx.objectStore(HIST.store).clear();
      tx.oncomplete = () => { db.close(); resolve(); };
      tx.onerror = () => { db.close(); reject(tx.error); };
    });
  }

  function fmtTime(ts){
    try { return new Date(ts).toLocaleString("zh-CN", {hour12:false}); }
    catch (e) { return ""; }
  }

  function histLabel(p){
    if (!p) return "未知任务";
    const head = p.mode === "asin" ? ("ASIN " + (p.asin || "—"))
                                   : (p.manual_title || "手动填写");
    return `${head} · ${p.site || "US"}${p.brand ? " · " + p.brand : ""}`;
  }

  async function saveHistory(payload, result){
    try {
      await histPut({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        created_at: Date.now(),
        job_id: jobId || "",
        params: payload,
        result: result
      });
      refreshHistCount();
    } catch (e) { /* 浏览器禁用存储时静默跳过 */ }
  }

  async function refreshHistCount(){
    try {
      const list = await histAll();
      $("historyBtn").textContent = list.length ? `历史记录（${list.length}）` : "历史记录";
    } catch (e) { $("historyBtn").textContent = "历史记录"; }
  }

  async function openHistory(){
    const body = $("historyBody");
    body.innerHTML = `<div class="empty">加载中…</div>`;
    $("historyModal").classList.remove("hide");
    try {
      const list = await histAll();
      if (!list.length) {
        body.innerHTML = `<div class="empty">暂无历史记录<br>生成完成后会自动保存在本机浏览器</div>`;
        return;
      }
      body.innerHTML = list.map(rec => `
        <div class="comp-item">
          <h4>${esc((rec.result && rec.result.product_name) || histLabel(rec.params))}</h4>
          <div class="meta">${esc(fmtTime(rec.created_at))} · ${esc(histLabel(rec.params))}</div>
          <div style="display:flex;gap:8px">
            <button class="action" data-hist-view="${esc(rec.id)}">查看结果</button>
            <button class="action warn" data-hist-del="${esc(rec.id)}">删除</button>
          </div>
        </div>`).join("");
      body.querySelectorAll("[data-hist-view]").forEach(btn => {
        btn.addEventListener("click", () => {
          const rec = list.find(x => x.id === btn.dataset.histView);
          if (rec) viewHistory(rec);
        });
      });
      body.querySelectorAll("[data-hist-del]").forEach(btn => {
        btn.addEventListener("click", async () => {
          await histDelete(btn.dataset.histDel);
          openHistory();
          refreshHistCount();
        });
      });
    } catch (e) {
      body.innerHTML = `<div class="empty">历史记录读取失败：${esc(e.message || e)}</div>`;
    }
  }

  function viewHistory(rec){
    if (!rec || !rec.result) return;
    jobId = null;
    clearInterval(timer);
    $("historyModal").classList.add("hide");
    $("resultCard").classList.add("hide");
    render(rec.result);
    // 历史记录不走服务器，隐藏依赖后端 job 的入口
    $("dlWrap").classList.add("hide");
    $("reviewBtn").classList.add("hide");
    $("status").textContent = "查看历史记录 · " + fmtTime(rec.created_at);
    $("log").textContent = "// 历史记录包含输入参数与生成结果（不含运行日志）";
    $("submitBtn").disabled = false;
  }

  $("historyBtn").addEventListener("click", openHistory);
  $("historyClose").addEventListener("click", () => $("historyModal").classList.add("hide"));
  $("historyModal").addEventListener("click", (e) => {
    if (e.target.id === "historyModal") $("historyModal").classList.add("hide");
  });
  $("historyClear").addEventListener("click", async () => {
    if (!confirm("确定清空本机浏览器里的全部历史记录？此操作不可恢复。")) return;
    await histClear();
    openHistory();
    refreshHistCount();
    toast("已清空历史记录");
  });
  refreshHistCount();

  // —— 输入框只记忆上一次的值（关掉浏览器历史下拉，避免堆积多条）——
  const REMEMBER_IDS = ["brand", "asin", "manual_title", "manual_price",
    "manual_breadcrumbs", "manual_specs", "manual_bullets", "competitors",
    "search_keyword", "seed_keywords", "extra", "drop_spec",
    "search_pages", "bsr_max"];
  const MEM_PREFIX = "lg_last_";

  // 1) 禁用浏览器自带的输入历史下拉（用非法值强制关闭，Chrome 对 off 有时不生效）
  document.querySelectorAll("#form input, #form textarea").forEach(el => {
    el.setAttribute("autocomplete", "nope");
    el.setAttribute("autocorrect", "off");
    el.setAttribute("spellcheck", "false");
  });

  // 2) 加载时只回填最近一次的值（每个字段最多一条）
  REMEMBER_IDS.forEach(id => {
    const el = $(id);
    if (!el) return;
    try {
      const v = localStorage.getItem(MEM_PREFIX + id);
      if (v !== null && v !== "") el.value = v;
    } catch (e) {}
  });

  // 3) 提交时覆盖保存，永远只保留最新一条
  function rememberInputs() {
    REMEMBER_IDS.forEach(id => {
      const el = $(id);
      if (!el) return;
      try {
        const v = (el.value || "").trim();
        if (v) localStorage.setItem(MEM_PREFIX + id, v);
        else localStorage.removeItem(MEM_PREFIX + id);
      } catch (e) {}
    });
  }

  document.querySelectorAll(".tab").forEach(t => {
    t.addEventListener("click", () => {
      mode = t.dataset.mode;
      document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
      $("asinBlock").classList.toggle("hide", mode !== "asin");
      $("manualBlock").classList.toggle("hide", mode !== "manual");
    });
  });

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
      ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  let toastTimer = null;
  function toast(msg){
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
  }

  function copyBtn(text, label){
    const data = encodeURIComponent(text || "");
    return `<button class="copy" data-copy="${data}">${label || "复制"}</button>`;
  }

  $("sampleBtn").addEventListener("click", () => {
    $("brand").value = "HOKEMOM";
    $("manual_title").value = "矩形水槽收纳架，带可拆卸高刷架";
    $("manual_price").value = "$14.53";
    $("manual_breadcrumbs").value = "Home & Kitchen > Kitchen & Dining > Kitchen Storage & Organization";
    $("manual_specs").value = "Material: 喷漆不锈钢\nColor: 黑色\nProduct Dimensions: 9.65\"D x 5.9\"W x 5.5\"H\nItem Weight: 1.4 pounds\nSpecial Feature: 快干, 防滑, 可拆卸高刷架";
    $("manual_bullets").value = "矩形框架配一个可拆卸、可调位置的高刷架\n附带吸水干燥石托盘\n底部防滑硅胶垫";
    $("seed_keywords").value = "sink caddy, kitchen sink organizer";
    $("search_keyword").value = "sink caddy, kitchen sink organizer";
    $("extra").value = "产品形态：矩形水槽收纳架 + 可拆卸高刷架，没有 6 个独立分隔仓。";
  });

  $("auto_competitors").addEventListener("change", (e) => {
    if (e.target.checked) toast("自动选品约 2-4 分钟，约 200 credits");
  });

  $("compBtn").addEventListener("click", () => {
    $("compBody").innerHTML = compData.map((c, i) => `
      <div class="comp-item">
        <h4>${i + 1}. ${esc(c.asin || "")} ${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">打开链接</a>` : ""}</h4>
        <div class="meta">${esc(c.price || "")}${c.rating ? " · " + esc(c.rating) : ""}${c.review_count ? " · " + esc(c.review_count) : ""}</div>
        <div class="en" style="font-size:13px;margin-bottom:8px">${esc(c.title || "")}</div>
        <ol>${(c.bullets || []).map(b => `<li>${esc(b)}</li>`).join("")}</ol>
      </div>`).join("");
    $("compModal").classList.remove("hide");
  });
  $("compClose").addEventListener("click", () => $("compModal").classList.add("hide"));
  $("compModal").addEventListener("click", (e) => {
    if (e.target.id === "compModal") $("compModal").classList.add("hide");
  });

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = {
      mode, site: $("site").value, brand: $("brand").value,
      asin: $("asin").value, competitors: $("competitors").value,
      auto_competitors: $("auto_competitors").checked,
      search_keyword: $("search_keyword").value,
      search_keywords: $("search_keyword").value,
      search_pages: +$("search_pages").value || 5,
      bsr_max: +$("bsr_max").value || 100,
      seed_keywords: $("seed_keywords").value,
      extra: $("extra").value, drop_spec: $("drop_spec").value,
      no_xiyou: $("no_xiyou").checked,
      review: $("review").checked,
      manual_title: $("manual_title").value,
      manual_price: $("manual_price").value,
      manual_breadcrumbs: $("manual_breadcrumbs").value,
      manual_specs: $("manual_specs").value,
      manual_bullets: $("manual_bullets").value
    };
    $("submitBtn").disabled = true;
    $("resultCard").classList.add("hide");
    $("log").textContent = "";
    $("status").textContent = "提交中…";
    lastPayload = payload;
    rememberInputs();
    try {
      const r = await fetch("/api/generate", {method:"POST",
        headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload)});
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || "提交失败");
      jobId = data.job_id;
      $("status").textContent = "任务运行中…";
      timer = setInterval(poll, 1200);
    } catch (err) {
      $("status").textContent = "失败：" + err.message;
      $("submitBtn").disabled = false;
    }
  });

  async function poll(){
    if (!jobId) return;
    try {
      const r = await fetch("/api/jobs/" + jobId);
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || "查询失败");
      const log = $("log");
      log.textContent = (d.logs || []).join("\n") || "// 启动中…";
      log.scrollTop = log.scrollHeight;
      if (d.status === "queued") $("status").textContent = "排队中…";
      if (d.status === "running") $("status").textContent = "任务运行中…";
      if (d.status === "done") {
        clearInterval(timer);
        $("status").textContent = "完成";
        $("submitBtn").disabled = false;
        render(d.result);
        saveHistory(lastPayload, d.result);
      } else if (d.status === "error") {
        clearInterval(timer);
        $("status").textContent = "失败：" + (d.error || "未知错误");
        $("submitBtn").disabled = false;
      }
    } catch (err) {
      clearInterval(timer);
      $("status").textContent = "查询失败：" + err.message;
      $("submitBtn").disabled = false;
    }
  }

  function render(res){
    if (!res) return;
    const name = res.product_name || "", nameZh = res.product_name_zh || "";
    const hi = res.highlights || "", hiZh = res.highlights_zh || "";
    const bullets = res.bullets || [], bulletsZh = res.bullets_zh || [];
    const comp = res.compliance || {};
    const issues = [].concat(comp.name_issues || [], comp.highlight_issues || [], comp.bullet_issues || []);

    let html = "";
    const cov = res.keyword_coverage;
    if (cov && cov.total) {
      const miss = (cov.missing || []).slice(0, 8).join("、");
      html += `<p class="zh">关键词覆盖：${cov.hit}/${cov.total}${miss ? `，未覆盖：${esc(miss)}` : ""}</p>`;
    }
    if (res.info_insufficient) {
      html += `<p class="zh" style="color:var(--warn)">⚠ 产品信息偏少（仅 ${res.feature_points?.length || 1} 个独立卖点），当前生成 ${res.bullet_count} 条五点；建议补充更多产品特征。</p>`;
    }
    html += `<div class="block"><h3>商品名称 ${copyBtn(name)}</h3>
      <p class="en">${esc(name)}</p><p class="zh">${esc(nameZh)}</p></div>`;
    html += `<div class="block"><h3>商品亮点 ${copyBtn(hi)}</h3>
      <p class="en">${esc(hi)}</p><p class="zh">${esc(hiZh)}</p></div>`;
    html += `<div class="block"><h3>五点描述 ${copyBtn(bullets.join("\n"))}</h3>`;
    bullets.forEach((b, i) => {
      html += `<div class="bullet"><div class="en"><span class="idx">${i+1}</span>${esc(b)}</div>
        <div class="zh" style="padding-left:20px">${esc(bulletsZh[i] || "")}</div></div>`;
    });
    html += `</div>`;

    const vars = res.title_variants || [];
    if (vars.length > 1) {
      html += `<details><summary>其他标题方案（${vars.length-1} 个）</summary><ul class="vars">`;
      vars.slice(1).forEach(v => {
        html += `<li><b>${esc(v.angle)}</b>
          <div class="en" style="margin:4px 0 2px">${esc(v.product_name)}</div>
          <div class="zh" style="margin:0 0 4px">${esc(v.product_name_zh || "")}</div>
          <div class="en" style="margin:0 0 2px;font-size:13px">${esc(v.highlights)}</div>
          <div class="zh" style="margin:0">${esc(v.highlights_zh || "")}</div></li>`;
      });
      html += `</ul></details>`;
    }
    if (issues.length) {
      html += `<ul class="issues">` + issues.map(x => `<li>${esc(x)}</li>`).join("") + `</ul>`;
    }

    compData = res.competitors || [];
    reviewData = res.review || {};
    const cbtn = $("compBtn");
    cbtn.classList.remove("hide");
    cbtn.disabled = !compData.length;
    cbtn.textContent = compData.length ? `查看竞品数据（${compData.length}）` : "无竞品数据";

    const revBtn = $("reviewBtn");
    if (reviewData.verdict && reviewData.verdict !== "skipped") {
      revBtn.classList.remove("hide");
      revBtn.classList.toggle("warn", reviewData.verdict !== "ready");
    } else if (reviewData.verdict === "skipped") {
      revBtn.classList.remove("hide");
      revBtn.disabled = true;
    } else {
      revBtn.classList.add("hide");
    }

    const dlWrap = $("dlWrap");
    if (res.output_stem) {
      dlWrap.classList.remove("hide");
    } else {
      dlWrap.classList.add("hide");
    }
    $("resultBody").innerHTML = html;
    $("resultCard").classList.remove("hide");

    document.querySelectorAll("[data-copy]").forEach(btn => {
      btn.addEventListener("click", () => {
        const text = decodeURIComponent(btn.dataset.copy);
        navigator.clipboard.writeText(text).then(() => {
          const old = btn.textContent;
          btn.textContent = "已复制";
          setTimeout(() => btn.textContent = old, 1200);
        });
      });
    });
  }

  // —— 下载下拉菜单 ——
  const dlWrap = $("dlWrap");
  const dlMenu = $("dlMenu");
  const dlToggle = $("dlToggle");
  dlToggle.addEventListener("click", (e) => {
    e.stopPropagation();
    dlMenu.classList.toggle("show");
  });
  dlMenu.querySelectorAll("button").forEach(b => {
    b.addEventListener("click", () => {
      const fmt = b.dataset.fmt;
      if (!jobId) return;
      window.location.href = `/api/jobs/${jobId}/download/${fmt}`;
      dlMenu.classList.remove("show");
    });
  });
  document.addEventListener("click", (e) => {
    if (!dlWrap.contains(e.target)) dlMenu.classList.remove("show");
  });

  // —— 合规评估：跳转到独立页面 ——
  $("reviewBtn").addEventListener("click", () => {
    if (!jobId) return;
    location.href = `/review?job=${encodeURIComponent(jobId)}`;
  });
})();
</script>
